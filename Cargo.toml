[workspace]
resolver = "2"
members = [".", "crates/openmassspec-arrow"]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenMassSpecCore"
homepage = "https://sigilweaver.app/openmassspec/docs/"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "openmassspec-core"
description = "Shared types, traits, and mzML writer for open Rust mass-spec parsers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openmassspec-core"
keywords = ["mass-spectrometry", "mzml", "proteomics", "metabolomics", "psi-ms"]
categories = ["science", "encoding"]
readme = "README.md"
exclude = ["/crates", "/.github"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror = "2"
# Default features (`rust_backend`, i.e. miniz_oxide) are a pure-safe-Rust
# zlib implementation with no C compiler / system zlib requirement, matching
# this crate's `unsafe_code = "forbid"` posture and keeping CI portable
# across the ubuntu/macos matrix.
flate2 = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
