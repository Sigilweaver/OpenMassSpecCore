[package]
name = "openmassspec-arrow"
description = "Apache Arrow RecordBatch bridge for openmassspec-core spectrum records."
# Own version line: a new Arrow major is released here without renumbering Core.
version = "4.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openmassspec-arrow"
keywords = ["mass-spectrometry", "arrow", "proteomics", "metabolomics"]
categories = ["science", "encoding"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["arrow-60"]
# Each arrow-rs major is a feature; a new one is added alongside, in a minor release.
arrow-60 = ["dep:arrow-array", "dep:arrow-schema"]

[dependencies]
openmassspec-core = { version = "4.0.0", path = "../.." }
thiserror = "2"
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
